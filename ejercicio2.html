<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo CSS # 2</title>
  <meta name="author" content="Yerminson Arias">
  <link rel="stylesheet" href="css/estilo2.css">
</head>

<body>
  <h1>Beautiful, Hand-crafted Layouts</h1>
  <section class="galeria">
    <figure class="item"><img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/1981_BMW_320_2.0_Front.jpg?width=600"
        onerror="this.onerror=null;this.src='img/bmw-serie3.svg'" alt="Real Estate">
      <figcaption>Real Estate</figcaption>
    </figure>
    <figure class="item"><img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/BMW_E30_front2_20080127.jpg?width=600"
        onerror="this.onerror=null;this.src='img/bmw-serie5.svg'" alt="Library">
      <figcaption>Library</figcaption>
    </figure>
    <figure class="item"><img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/BMW_E36_rear_20070816.jpg?width=600"
        onerror="this.onerror=null;this.src='img/bmw-x5.svg'" alt="Transportation">
      <figcaption>Transportation</figcaption>
    </figure>
    <figure class="item"><img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/2001-2005_BMW_318i_(E46)_sedan_02.jpg?width=600"
        onerror="this.onerror=null;this.src='img/bmw-m4.svg'" alt="Gas &amp; Oil">
      <figcaption>Gas &amp; Oil</figcaption>
    </figure>
    <figure class="item"><img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/2005-2008_BMW_325i_(E90)_sedan_03.jpg?width=600"
        onerror="this.onerror=null;this.src='img/bmw-i4.svg'" alt="Marketing Agency">
      <figcaption>Marketing Agency</figcaption>
    </figure>
    <figure class="item"><img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/2013_BMW_328i_(F30)_M_Sport_sedan_(2018-11-02)_01.jpg?width=600"

      <figcaption>Pizza</figcaption>
    </figure>
    <figure class="item"><img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/2013_BMW_328i_(F30)_M_Sport_sedan_(2018-11-02)_02.jpg?width=600"
        onerror="this.onerror=null;this.src='img/bmw-x3.svg'" alt="Flooring">
      <figcaption>Flooring</figcaption>
    </figure>
    <figure class="item"><img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/2019_BMW_318d_SE_Automatic_2.0_Front.jpg?width=600"
        onerror="this.onerror=null;this.src='img/bmw-m3.svg'" alt="Steel Processing">
      <figcaption>Steel Processing</figcaption>
    </figure>
    <figure class="item pronto">
      <div class="caja"><img src="img/bmw-pronto.svg" alt="Coming Soon"></div>
      <figcaption>Coming Soon</figcaption>
    </figure>
